[package]
name = "gravity-cube-firmware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "firmware"
path = "src/main.rs"

[dependencies]
# Core library with effects (no_std mode - disable default features)
gravity-cube-core = { workspace = true, default-features = false }

# Math utilities (for F32Ext trait in no_std)
micromath.workspace = true

# ESP32 dependencies
esp-hal = { version = "1.2.2", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp32s3",
  "log-04",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
log.workspace = true

# Async runtime
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.1", features = ["log"] }
esp-alloc = "0.11.0"
esp-backtrace = { version = "0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }

critical-section = "1.2.0"
embassy-sync = "0.8.0"
static_cell = "2.1.1"

# Embedded utilities
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }


# WS2812 LED driver
smart-leds = "0.4.0"
esp-hal-smartled = "0.18.0"
