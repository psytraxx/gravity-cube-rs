[workspace]
resolver = "2"
members = ["core", "firmware", "desktop"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.2.0"

[workspace.dependencies]
# Shared core dependencies (no_std compatible)
micromath = { version = "2.1.0", features = ["vector"] }
log = "0.4.29"

# Core library (default-features = false for no_std compatibility, enable "std" feature explicitly in desktop)
gravity-cube-core = { path = "./core", default-features = false }

[profile.dev]
# Rust debug is too slow for embedded.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
