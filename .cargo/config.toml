# Convenience aliases for desktop, core, and firmware
# Note: Firmware aliases use --manifest-path to pick up the correct toolchain configuration.

[alias]
# Desktop commands
desktop-build = "build -p gravity-cube-desktop --release"
desktop-run = "run -p gravity-cube-desktop --release"
desktop-clippy = "clippy -p gravity-cube-desktop"

# Core library commands
core-clippy = "clippy -p gravity-cube-core"
core-test = "test -p gravity-cube-core -p gravity-cube-desktop"

# Firmware commands
firmware-build = "build --manifest-path firmware/Cargo.toml --release"
firmware-clippy = "clippy --manifest-path firmware/Cargo.toml"
