[package]
name = "gravity-cube-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "gravity-cube-desktop"
path = "src/main.rs"

[dependencies]
# Core library with std feature enabled
gravity-cube-core = { workspace = true, features = ["std"] }

# Math (glam for desktop 3D)
glam = "0.34.1"

# 3D rendering with wgpu
wgpu = "30.0.1"
winit = "0.30.13"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }

# Logging
env_logger = "0.11.11"
log.workspace = true

# Random
rand = "0.10.3"
